services:
  - type: web
    name: ai-dev-blog-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # 构建上下文必须是仓库根：镜像除 backend/ 外还要打进 scripts/config/*.json，
    # 后端的封面风格与主题展示规则从那里加载（见 backend/Dockerfile 注释）。
    dockerContext: .
    region: oregon
    healthCheckPath: /readyz
    envVars:
      # 显式声明生产环境，不依赖 Render 注入的 RENDER* 变量做隐式推断。
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional dedicated Fernet key for AI provider API keys. When omitted,
      # the app derives an isolated encryption key from SECRET_KEY.
      # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Comma-separated extensions for custom OpenAI-compatible gateways.
      # Built-in provider hosts and key variable names are allowed automatically.
      #
      # AI_PROVIDER_ALLOWED_BASE_URL_HOSTS 现在只是白名单的**一份来源**：运行时取
      # 「内置预设 ∪ 这个环境变量 ∪ 数据库表 ai_provider_allowed_hosts」的并集
      # （services/ai_provider_manager._allowed_base_url_hosts）。后台「允许的 Base URL
      # 主机」页面写的是数据库那一份，加网关不必再改这里重新部署；这里配的几个是历史
      # 存量，删掉会让依赖它们的运行时计划立刻空掉，所以两份都要留着。
      # 值本身不进仓库（sync: false）：在 Render 面板里维护。条目以 "." 开头表示匹配
      # 子域。白名单只回答「允许哪些主机」，私网/保留地址的拦截另有其人，不受它影响。
      - key: AI_PROVIDER_ALLOWED_BASE_URL_HOSTS
        sync: false
      - key: AI_PROVIDER_ALLOWED_KEY_ENV_VARS
        sync: false
      # Honor the X-Forwarded-For hop appended by Render. CF-Connecting-IP stays
      # disabled unless direct origin access is separately restricted.
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: TRUSTED_PROXY_DEPTH
        value: "1"
      - key: AUTO_SEED_ON_EMPTY
        value: "0"
      - key: ENABLE_STARTUP_SCHEMA_SYNC
        value: "0"
      # Canonical host. Also seeds CORS when ALLOWED_ORIGINS is empty
      # (env.get_allowed_origins() returns [] in production without either).
      - key: PUBLIC_SITE_URL
        value: https://www.563118077.xyz
      - key: ALLOWED_ORIGINS
        sync: false
      # Cloudflare Turnstile. When unset, turnstile_ready() is False and human
      # verification silently turns off on register/login.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Production must use durable R2 storage. Set to "1" only for an
      # explicitly accepted emergency deployment with ephemeral local uploads.
      - key: ALLOW_EPHEMERAL_UPLOADS
        value: "0"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_REGION
        value: auto
      # 订阅通知相关变量不会从 GitHub Secret 自动同步到运行时；
      # 需要在 Render 后端服务环境变量中手动填写并重新部署。
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false
      - key: WECOM_WEBHOOK_URLS
        sync: false
      # 发布后触发 Vercel 重新构建（app/frontend_refresh.py）。
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false
      # AI 生成兜底：后台 AI Provider 未配置时作为 env 回退密钥/端点
      # （services/ai_channels.py）。
      - key: XAI_API_KEY
        sync: false
      - key: SILICONFLOW_BASE_URL
        sync: false
      - key: SILICONFLOW_MODEL
        sync: false
      # 生图等待上限，取值被夹在 60-600 秒之间。
      - key: IMAGE_GENERATION_TIMEOUT_SECONDS
        value: "300"
