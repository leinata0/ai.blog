    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23071016'/><path d='M23 67 46 39l20 22 12-17' fill='none' stroke='%2357d8ea' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='23' cy='67' r='6' fill='%23ffad68'/><circle cx='46' cy='39' r='6' fill='%2357d8ea'/><circle cx='66' cy='61' r='6' fill='%23a997ff'/></svg>">
    <script>
      (() => {
        let dark = false
        try {
          dark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch {}
        const standard = /^(\/admin|\/account|\/login|\/register|\/forgot-password|\/reset-password|\/verify-email)/.test(location.pathname)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.surface = standard ? 'standard' : 'editorial'
        document.querySelector('meta[name="theme-color"]').content = standard ? (dark ? '#09111d' : '#edf3f8') : (dark ? '#071016' : '#f3f3ef')
      })()
    </script>
    <title>AI 资讯观察</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
