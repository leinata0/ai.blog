<!doctype html>
<html lang="zh-CN" data-news-style="tech">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the SEO copy below identical to SITE_SEO in src/utils/contentPresentation.js.
         The build-time prerender rewrites these tags per route and asserts they exist. -->
    <meta name="description" content="聚焦人工智能新闻、模型与产品更新、研究进展和产业变化，通过头条、日报、周报与主题阅读连接事件背景。">
    <meta name="theme-color" content="#eee9df">
    <meta property="og:title" content="AI 资讯观察 | 人工智能新闻、产品与产业观察">
    <meta property="og:description" content="聚焦人工智能新闻、模型与产品更新、研究进展和产业变化，通过头条、日报、周报与主题阅读连接事件背景。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.563118077.xyz">
    <link rel="alternate" type="application/rss+xml" title="AI 资讯观察 RSS" href="/feed.xml">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23071016'/><path d='M23 67 46 39l20 22 12-17' fill='none' stroke='%2357d8ea' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><circle cx='23' cy='67' r='6' fill='%23ffad68'/><circle cx='46' cy='39' r='6' fill='%2357d8ea'/><circle cx='66' cy='61' r='6' fill='%23a997ff'/></svg>">
    <script>
      (() => {
        let dark = false
        let newsStyle = 'tech'
        try {
          dark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)
          newsStyle = localStorage.getItem('news-style') === 'paper' ? 'paper' : 'tech'
        } catch {}
        const pathname = location.pathname.replace(/\/+$/, '') || '/'
        const authRoutes = new Set(['/account', '/login', '/register', '/forgot-password', '/reset-password', '/verify-email'])
        const surface = pathname === '/admin' || pathname.startsWith('/admin/')
          ? 'operations'
          : authRoutes.has(pathname)
            ? 'auth'
            : 'editorial'
        const themeColors = {
          editorial: { light: '#f8f6f1', dark: '#1c1b18' },
          auth: { light: '#eeefe9', dark: '#080f13' },
          operations: { light: '#e9edef', dark: '#05090d' },
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.surface = surface
        document.documentElement.dataset.newsStyle = newsStyle
        document.querySelector('meta[name="theme-color"]').content = surface === 'editorial' && newsStyle === 'tech'
          ? '#eee9df' : themeColors[surface][dark ? 'dark' : 'light']
      })()
    </script>
    <title>AI 资讯观察 | 人工智能新闻、产品与产业观察</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
