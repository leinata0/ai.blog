name: CI 质量闸门

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # --frozen 与 backend/Dockerfile 的生产安装保持一致，避免 CI 验证的
      # 依赖版本与上线版本漂移。
      - name: Install backend dependencies
        run: uv sync --project backend --extra dev --frozen

      - name: Run backend tests
        run: uv run --project backend pytest backend/tests

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # 预渲染失败即构建失败。PR 上不打生产后端：Render 冷启动或抖动会把
      # 与改动无关的 PR 直接弄红。只有 push master 时做完整 SSG 构建。
      - name: Build frontend
        run: npm run build
        env:
          SKIP_PRERENDER: ${{ github.event_name == 'pull_request' && '1' || '' }}
          PRERENDER_API_BASE: https://ai-blog-hbur.onrender.com
          PUBLIC_SITE_URL: https://www.563118077.xyz

  scripts-tests:
    name: Scripts tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        run: npm ci

      - name: Run script tests
        run: npm test
