name: 发布架构迁移总结

on:
  push:
    branches:
      - master
    # 只在"这篇文章的内容本身"变更时重新发布。
    # scripts/publish-content-file.mjs 是通用发布工具（文章路径由 ARTICLE_FILE 决定），
    # 改它并不代表这篇文章的内容变了；把它留在 paths 里会让任何一次工具重构都对生产后端
    # 发一次真实写请求，并把无关的 CI 状态挂在共享脚本的改动上。
    # 本文件自身同理：改发布流程的超时/重试策略不等于文章内容变了，留着会让每次流程调整
    # 都触发一次生产写入（并可能触发一次付费封面生成）。要重新发布请用 workflow_dispatch。
    paths:
      - 'scripts/content/blog-migration-neon-r2.mjs'
  workflow_dispatch:
    inputs:
      article_file:
        description: 要发布的文章模块路径
        required: false
        default: './content/blog-migration-neon-r2.mjs'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # 后端跑在会休眠的 Render 实例上：冷启动唤醒最多 3 分钟，登录退避最多约 3.5 分钟，
    # 封面生成任务轮询预算 7 分钟（lib/admin-image-generation.mjs）。10 分钟不够覆盖
    # "冷启动 + 生成封面"这条最慢路径。
    timeout-minutes: 25
    steps:
      # 拉取仓库代码
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      # 安装 Node.js
      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 发布文章，并通过后台已配置的图片生成渠道生成封面。
      - name: 发布文章并生成封面
        working-directory: scripts
        env:
          ARTICLE_FILE: ${{ github.event.inputs.article_file || './content/blog-migration-neon-r2.mjs' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BLOG_API_BASE: ${{ vars.BLOG_API_BASE }}
        run: node publish-content-file.mjs
